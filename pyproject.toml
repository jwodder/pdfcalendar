[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdfcalendar"
dynamic = ["version"]
description = "Python script for creating a multiyear calendar PDF document"
readme = "README.rst"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "John Thorvald Wodder II", email = "pdfcalendar@varonathe.org" }
]

keywords = [
    "pdf",
    "calendar",
    "year",
]

classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Printing",
    "Typing :: Typed",
]

dependencies = [
    "attrs >= 20.1",
    "reportlab ~= 4.0",
]

[project.scripts]
pdfcalendar = "pdfcalendar.__main__:main"

[project.urls]
"Source Code" = "https://github.com/jwodder/pdfcalendar"
"Bug Tracker" = "https://github.com/jwodder/pdfcalendar/issues"

[tool.hatch.version]
path = "src/pdfcalendar/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/docs",
    "/src",
    "/test",
    "CHANGELOG.*",
    "CONTRIBUTORS.*",
    "tox.ini",
]

[tool.mypy]
allow_incomplete_defs = false
allow_untyped_defs = false
ignore_missing_imports = false
# <https://github.com/python/mypy/issues/7773>:
no_implicit_optional = true
implicit_reexport = false
local_partial_types = true
pretty = true
show_error_codes = true
show_traceback = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
